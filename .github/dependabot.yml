# Keep the shelf current. Every day Dependabot looks at each game's main branch (the `branch = main` in
# .gitmodules) and, where it has moved, opens a pull request that moves the submodule to it. That pull request runs
# the whole build and the smoke test (.github/workflows/pages.yml), so a game that would break the arcade shows up
# red there; merging it deploys.
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: Games
