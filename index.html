<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Arcade">
<meta name="theme-color" content="#14101a">
<title>Arcade</title>
<!-- Home-screen app: tools/pwa.js generates the manifest, the icons and the worker. The shelf works without them. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>
  (function () {
    // Framed by somebody else's page: the app scope is not ours to claim.
    if (window.top !== window) return;
    if ('serviceWorker' in navigator) {
      // After load: the worker caches the shelf and every game for the NEXT launch, and the page comes first.
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) { return reg.update(); })
          .catch(function () { /* file://, offline, or not deployed */ });
      });
    }
    // Every game on the shelf is a 640x360 landscape picture, so an installed copy is held to landscape where the
    // platform allows it; where it does not (iOS), each game's own "turn your device sideways" notice covers it.
    var mm = window.matchMedia;
    var installed = (mm && (mm('(display-mode: fullscreen)').matches || mm('(display-mode: standalone)').matches)) || navigator.standalone;
    if (installed && screen.orientation && screen.orientation.lock) {
      try {
        var lock = screen.orientation.lock('landscape');
        if (lock && lock.catch) lock.catch(function () { /* refused */ });
      } catch (e) { /* unsupported */ }
    }
  })();
</script>
<style>
  :root { --ground: #14101a; --card: #211a2b; --card-hi: #2a2137; --ink: #f3e9d2; --dim: #a99cb6; --focus: #e2b34a;
          color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ground); color: var(--ink);
               font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; -webkit-text-size-adjust: 100%; }
  body.playing { overflow: hidden; }
  main { max-width: 980px; margin: 0 auto;
         padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                  max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  h1 { margin: 4px 0 2px; font-size: 22px; letter-spacing: 6px; }
  header p { margin: 0 0 18px; color: var(--dim); }
  .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px;
           grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  .card { display: flex; flex-direction: column; height: 100%; color: inherit; text-decoration: none; outline: none;
          background: var(--card); border: 2px solid transparent; border-radius: 10px; overflow: hidden;
          transition: transform .12s, border-color .12s, background-color .12s; }
  .card:hover { background: var(--card-hi); }
  .card:focus-visible { border-color: var(--focus); transform: translateY(-2px); }
  .art { position: relative; aspect-ratio: 16 / 9; background: var(--art-ground, #000); }
  .art img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .art .name { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px;
               font-size: 20px; letter-spacing: 3px; text-align: center; color: var(--art-accent, var(--ink)); }
  .art img + .name { display: none; }
  .meta { display: block; padding: 10px 12px 12px; }
  .meta b { font-size: 15px; }
  .meta span, .meta small { display: block; color: var(--dim); }
  .meta small { margin-top: 4px; }
  footer { margin-top: 22px; color: var(--dim); font-size: 12px; }
  footer a { color: inherit; }
  #stage { position: fixed; inset: 0; background: #000; }
  #stage iframe { display: block; width: 100%; height: 100%; border: 0; }
  #back { position: fixed; z-index: 2; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
          padding: 5px 10px; border: 0; border-radius: 6px; background: rgba(0, 0, 0, .55); color: #fff;
          font: inherit; font-size: 12px; letter-spacing: 1px; opacity: .6; cursor: pointer; }
  #back:hover, #back:focus-visible { opacity: 1; }
  /* A phone on its side - which is how the installed app is held - has ~390 px of height: the cards and nothing else. */
  @media (max-height: 500px) {
    main { padding-top: max(10px, env(safe-area-inset-top)); }
    h1 { margin: 0 0 8px; font-size: 18px; }
    header p, .meta span, footer { display: none; }
    .meta { padding: 6px 10px 8px; }
    .meta small { margin-top: 0; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="shelf">
  <header>
    <h1>ARCADE</h1>
    <p>Pick a game. Each one plays here exactly as it does on its own site.</p>
  </header>
  <ul class="cards" id="cards"></ul>
  <footer id="credits"></footer>
</main>
<div id="stage" hidden>
  <button id="back" type="button" hidden>&#9664; ARCADE</button>
</div>
<!-- The shelf: games.json, inlined by tools/build.js (and by tools/server.js in development). -->
<script id="games" type="application/json">__GAMES__</script>
<script>
  (function () {
    'use strict';
    var GAMES = [];
    try { GAMES = JSON.parse(document.getElementById('games').textContent); } catch (e) { GAMES = []; }

    var shelf = document.getElementById('shelf'), cards = document.getElementById('cards');
    var stage = document.getElementById('stage'), back = document.getElementById('back');
    /**
     * How long a game has to say hello (engine/arcade.ts in each game's repository) before the shelf offers its own
     * button back. A game that says it has a way back of its own gets nothing drawn over it.
     */
    var FALLBACK_MS = 1500;
    /** The game on stage - { game, query, frame, aware, fromShelf } - or null while the shelf is up. */
    var current = null;
    /** The last game played, whose card takes the focus when the shelf comes back. */
    var lastId = '';
    var booted = false;

    // ---- the shelf ----------------------------------------------------------------------------------------------
    GAMES.forEach(function (g) {
      var a = el('a', 'card');
      a.href = '#' + g.id;
      a.dataset.id = g.id;
      a.style.setProperty('--art-ground', g.ground || '#000');
      a.style.setProperty('--art-accent', g.accent || '');
      var art = el('span', 'art'), img = el('img');
      img.alt = ''; img.width = 640; img.height = 360; img.decoding = 'async';
      img.src = 'games/' + g.id + '/cover.png';
      // No cover (built without a browser, or a game added since): the game's name on its own colours instead.
      img.addEventListener('error', function () { img.remove(); });
      art.append(img, el('span', 'name', g.title.toUpperCase()));
      var meta = el('span', 'meta');
      meta.append(el('b', '', g.title), el('span', '', g.blurb || ''), el('small', '', g.players || ''));
      a.append(art, meta);
      var li = el('li');
      li.append(a);
      cards.append(li);
    });
    var credits = document.getElementById('credits');
    GAMES.forEach(function (g) {
      var link = el('a', '', g.title);
      link.href = g.repo || '#';
      credits.append(link, document.createTextNode((g.commit ? ' ' + g.commit : '') + '  ·  '));
    });
    var src = el('a', '', 'arcade source');
    src.href = 'https://github.com/ssinnott/arcade';
    credits.append(src);

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    // ---- routes: #<game id>[?query] is that game, anything else is the shelf -------------------------------------
    function parseRoute() {
      var m = /^#([A-Za-z0-9-]+)(\?.*)?$/.exec(location.hash);
      if (!m) return null;
      var id = m[1].toLowerCase(), game = null;
      for (var i = 0; i < GAMES.length; i++) if (GAMES[i].id === id) game = GAMES[i];
      if (!game) return null;
      // The query becomes the game's own location.search: an invite's ?room=CODE, or a dev flag. Names are lowered
      // because a link read off a game's all-capitals screen comes back typed in capitals.
      var fwd = new URLSearchParams();
      new URLSearchParams((m[2] || '').slice(1)).forEach(function (v, k) { fwd.append(k.toLowerCase(), v); });
      var q = fwd.toString();
      return { game: game, query: q ? '?' + q : '' };
    }

    function route(fromShelf) {
      var r = parseRoute();
      if (!r) { showShelf(); return; }
      if (current && current.game === r.game && current.query === r.query) return;
      openGame(r.game, r.query, fromShelf);
    }

    function openGame(game, query, fromShelf) {
      closeFrame();
      var frame = document.createElement('iframe');
      frame.title = game.title;
      // The name is how the game tells the arcade from any other page that frames it (engine/arcade.ts): `arcade:`,
      // then the link that opens this game here, ready for a room code on the end.
      frame.name = 'arcade:' + location.origin + location.pathname + '#' + game.id + '?room=';
      frame.allow = 'fullscreen; gamepad; autoplay; clipboard-write; web-share';
      frame.src = 'games/' + game.id + '/' + query;
      var entry = { game: game, query: query, frame: frame, aware: false, fromShelf: !!fromShelf };
      current = entry;
      frame.addEventListener('load', function () {
        // The games read keys from their own window, so the frame has to hold the focus.
        try { frame.contentWindow.focus(); } catch (e) { /* not ours to focus */ }
        setTimeout(function () { if (current === entry && !entry.aware) back.hidden = false; }, FALLBACK_MS);
      });
      back.hidden = true;
      stage.append(frame);
      stage.hidden = false;
      shelf.hidden = true;
      document.body.classList.add('playing');
      document.title = game.title + ' · Arcade';
      lastId = game.id;
      stopPad();
    }

    function closeFrame() {
      if (!current) return;
      // Removing the frame is the whole teardown: the game's loop, sound, sockets and listeners all go with it.
      current.frame.remove();
      current = null;
    }

    function showShelf() {
      closeFrame();
      stage.hidden = true;
      back.hidden = true;
      shelf.hidden = false;
      document.body.classList.remove('playing');
      document.title = 'Arcade';
      var card = cards.querySelector('.card[data-id="' + lastId + '"]') || cards.querySelector('.card');
      if (card) card.focus();
      startPad();
    }

    /** Back to the shelf. Opened from it, that is one step back in history, which is what a back button does too. */
    function leave() {
      if (!current) return;
      if (current.fromShelf) history.back();
      else { history.replaceState(null, '', location.pathname + location.search); showShelf(); }
    }

    window.addEventListener('hashchange', function () { route(booted && !current); });
    back.addEventListener('click', leave);

    // ---- what a game says (engine/arcade.ts): only the game on stage, only from this origin -----------------------
    window.addEventListener('message', function (e) {
      if (!current || e.source !== current.frame.contentWindow || e.origin !== location.origin) return;
      var d = e.data || {};
      if (d.type === 'arcade:hello') { current.aware = true; back.hidden = true; }
      else if (d.type === 'arcade:exit') leave();
      else if (d.type === 'arcade:room' && /^[A-Z0-9]{1,16}$/.test(String(d.room))) {
        // The host's room in the address bar, the way a game on its own puts it in its own.
        current.query = '?room=' + d.room;
        history.replaceState(null, '', '#' + current.game.id + current.query);
      }
    });

    // ---- keys on the shelf: arrows walk the cards, Enter opens one ----------------------------------------------
    document.addEventListener('keydown', function (e) {
      if (current) return;
      // A held Enter must not open the card it lands on: the press that left a game may still be repeating.
      if (e.repeat && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return; }
      var dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (!dir) return;
      e.preventDefault();
      move(dir[0], dir[1]);
    });

    /** Focus the nearest card that way (left/right/up/down), so a grid of any width walks the way it looks. */
    function move(dx, dy) {
      var list = [].slice.call(cards.querySelectorAll('.card'));
      var at = list.indexOf(document.activeElement);
      if (at < 0) { if (list[0]) list[0].focus(); return; }
      var from = list[at].getBoundingClientRect(), best = null, bestD = Infinity;
      list.forEach(function (c, i) {
        if (i === at) return;
        var r = c.getBoundingClientRect();
        var ox = (r.left + r.width / 2) - (from.left + from.width / 2), oy = (r.top + r.height / 2) - (from.top + from.height / 2);
        var along = dx ? ox * dx : oy * dy, across = dx ? Math.abs(oy) : Math.abs(ox);
        if (along <= 0) return;
        var d = along + across * 2;
        if (d < bestD) { bestD = d; best = c; }
      });
      if (best) best.focus();
    }

    // ---- pads on the shelf: stick or d-pad walks, A or START opens - on release --------------------------------
    var padTimer = 0, padArmed = false, padHeld = '', padNext = 0, padConfirm = false;
    function startPad() {
      padArmed = false;
      if (!padTimer && navigator.getGamepads) padTimer = requestAnimationFrame(pollPad);
    }
    function stopPad() {
      if (padTimer) cancelAnimationFrame(padTimer);
      padTimer = 0;
    }
    function pollPad(t) {
      padTimer = requestAnimationFrame(pollPad);
      var pads = navigator.getGamepads() || [], dir = '', confirm = false, any = false;
      for (var i = 0; i < pads.length; i++) {
        var p = pads[i];
        if (!p) continue;
        var b = p.buttons, ax = p.axes[0] || 0, ay = p.axes[1] || 0;
        var on = function (n) { return !!(b[n] && b[n].pressed); };
        if (on(14) || ax < -0.5) dir = 'left';
        else if (on(15) || ax > 0.5) dir = 'right';
        else if (on(12) || ay < -0.5) dir = 'up';
        else if (on(13) || ay > 0.5) dir = 'down';
        if (on(0) || on(9)) confirm = true;
        for (var k = 0; k < b.length; k++) if (b[k] && b[k].pressed) any = true;
      }
      // Nothing counts until every button is up: the press that chose BACK TO ARCADE may still be held.
      if (!padArmed) { padArmed = !any && !dir; padConfirm = false; padHeld = ''; return; }
      if (dir && (dir !== padHeld || t >= padNext)) {
        move(dir === 'left' ? -1 : dir === 'right' ? 1 : 0, dir === 'up' ? -1 : dir === 'down' ? 1 : 0);
        padNext = t + (dir === padHeld ? 160 : 380);
      }
      padHeld = dir;
      // Open on release, so the button is not still down when the game starts listening to it.
      if (confirm) padConfirm = true;
      else if (padConfirm) {
        padConfirm = false;
        var c = document.activeElement;
        if (c && c.classList && c.classList.contains('card')) c.click();
      }
    }

    route(false);
    booted = true;
  })();
</script>
</body>
</html>
